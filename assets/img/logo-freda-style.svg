<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 104" role="img" aria-label="FREDA STYLE Clothing Store">
  <title>FREDA STYLE</title>
  <!-- Hauptfassung: Wortmarke, Goldlinie, Unterzeile.
       Die Unterzeile ist bewusst kraeftig gesetzt, damit sie auch bei
       kleiner Darstellung im Header lesbar bleibt. -->
  <text x="280" y="50"
        text-anchor="middle"
        textLength="536" lengthAdjust="spacing"
        font-family="'Playfair Display','Cormorant Garamond','Didot','Times New Roman',serif"
        font-size="56" font-weight="500" letter-spacing="12"
        fill="currentColor">FREDA STYLE</text>
  <g opacity="0.9">
    <line x1="150" y1="72" x2="252" y2="72" stroke="#111111" stroke-width="1.6"/>
    <line x1="308" y1="72" x2="410" y2="72" stroke="#111111" stroke-width="1.6"/>
    <circle cx="280" cy="72" r="3" fill="#111111"/>
  </g>
  <text x="280" y="96"
        text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="19" font-weight="400" letter-spacing="7"
        fill="currentColor" opacity="0.78">CLOTHING STORE</text>
</svg>
